<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Colônia de Férias</title><link rel="icon" href="data:,">
<style>
:root{--bg:#EDF2F8;--bgr:237,242,248;--card:#F9FBFE;--tx:#1E2A3A;--mu:#55657A;--bd:#D2DCE8;--b:#3B6FA0;--btx:#fff;--soft:#E1EAF4;--p:#D4849F;--pk:#D4849F;--pkt:#A84F73;--tk:#DCE8F3;--okt:#166534;--ok:#3f9b6b;--am:#c98a2b;--rd:#c4554f;--ph:linear-gradient(135deg,#9CC3E6,#F2B8CB);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#141E29;--bgr:20,30,41;--card:#1D2A39;--tx:#E6EDF5;--mu:#9FB0C4;--bd:#31445A;--b:#86B6E2;--btx:#0B1624;--soft:#283A4E;--p:#EFA5BE;--pk:#EFA5BE;--pkt:#F2B3C8;--tk:#1B2836;--okt:#86efac;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}a{color:var(--b)}
button,input,select,textarea{font:inherit}input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin:3px 0}
.btn{background:var(--b);color:var(--btx);border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;margin:0}.btn.s{background:var(--soft);color:var(--b);border:1px solid var(--bd)}.btn.r{background:var(--rd);color:#fff}.card>.btn{margin:12px 12px 0 0}
.hero{position:relative;min-height:300px;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;color:var(--tx);background:linear-gradient(180deg,rgba(var(--bgr),0) 0%,rgba(var(--bgr),.6) 50%,var(--bg) 95%),var(--ph);background-size:100% 100%,cover;background-position:center,calc(10% + var(--sl)*25%) 30%;transition:background-position .8s}
.hero h1{font-size:clamp(2.3rem,11vw,4.2rem);line-height:.95;font-weight:900;letter-spacing:-.02em;margin:4px 0}.hero h1 em,.lg h1 em{font-style:normal;color:var(--pkt)}.hero small,.lg small{color:var(--b);letter-spacing:.3em;font-weight:800;font-size:.7rem}.hero .sub,.lg p{color:var(--mu);font-weight:700;margin:6px 0}
.top{position:absolute;top:10px;left:16px;right:16px;display:flex;justify-content:space-between;font-size:.8rem;font-weight:700}.top span:first-child,.cl{background:rgba(var(--bgr),.85);padding:2px 10px;border-radius:12px}.top span:first-child{color:var(--b)}.cl{color:var(--okt)}
.tg{border:1px solid var(--bd);background:rgba(var(--bgr),.9);color:var(--tx);border-radius:16px;padding:5px 12px;font-weight:700;cursor:pointer;font-size:.75rem;z-index:30}
.dots span{display:inline-block;width:24px;height:4px;background:var(--bd);margin:0 3px;cursor:pointer}.dots .on{background:var(--b)}
.login{min-height:100vh;display:flex;align-items:center;padding:24px;color:var(--tx);background:linear-gradient(180deg,rgba(var(--bgr),.55),var(--bg) 85%),var(--ph) center/cover}.lg{max-width:420px;margin:auto;width:100%}.lg h1{font-size:3.6rem;line-height:.9;font-weight:900;margin:8px 0}
.big{display:block;width:100%;margin:12px 0;padding:18px;border:2px solid var(--b);background:var(--card);color:var(--b);font-weight:900;letter-spacing:.2em;font-size:1rem;border-radius:4px;cursor:pointer}.big.pk{background:var(--b);color:var(--btx)}
nav{display:flex;overflow-x:auto;gap:10px;padding:12px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}nav button{white-space:nowrap;border:0;background:none;color:var(--mu);font-weight:800;cursor:pointer;padding:8px 14px;text-transform:uppercase;letter-spacing:.08em;font-size:.75rem}nav .on{color:var(--b);border-bottom:3px solid var(--pk)}
main{padding:24px 18px 56px;max-width:900px;margin:auto}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px;margin:20px 0}.card b{letter-spacing:.02em}.card>input,.card>select,.card>textarea{margin:10px 0}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px}.g .card{margin:0}.n{font-size:2.6rem;font-weight:900;line-height:1;color:var(--b)}
.stat{padding:22px 18px;text-align:left;font:inherit;color:var(--tx);cursor:pointer;display:block;width:100%;transition:transform .15s}.stat:active{transform:scale(.97)}.stat:nth-child(3n+1){border-left:5px solid var(--b)}.stat:nth-child(3n+2){border-left:5px solid var(--pk)}.stat:nth-child(3n){border-left:5px solid var(--soft)}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;font-weight:700;color:#fff;background:#64748b}.tag.ok{background:var(--ok)}.tag.am{background:var(--am)}.tag.rd{background:var(--rd)}
.tk{overflow:hidden;white-space:nowrap;background:var(--tk);color:var(--tx);border-top:1px solid var(--bd);font-size:.8rem;padding:6px;position:sticky;bottom:0}.tk span{display:inline-block;padding-left:100%;animation:t 25s linear infinite}@keyframes t{to{transform:translateX(-100%)}}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);padding:14px 0}.al{border-left:4px solid var(--rd);padding-left:8px}[data-f]{cursor:pointer}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}.bar>.btn{flex:1 1 140px;margin:0}.bar>input{flex:1 1 100%;margin:0}
.mv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}.mv select,.mv input{margin:0}
.ov{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:12px;z-index:20}.ov>div{background:var(--card);color:var(--tx);border-radius:16px;padding:22px;max-width:520px;width:100%;max-height:90vh;overflow:auto}.ov input,.ov select,.ov textarea{margin:8px 0}
.sh{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:15;animation:fi .25s}.sh.out{animation:fo .25s forwards}
.phone{width:min(360px,94vw);max-height:90vh;max-height:90dvh;display:flex;flex-direction:column;background:var(--card);color:var(--tx);border:8px solid #1e293b;border-radius:36px;overflow:hidden;animation:up .32s cubic-bezier(.2,.9,.3,1.1)}.sh.out .phone{animation:dn .25s forwards}
.notch{width:90px;height:6px;background:#1e293b;border-radius:4px;margin:10px auto 4px}.ph-h{padding:6px 20px}.ph-h h2{margin:2px 0;font-size:1.45rem;line-height:1.1}.ph-h small{color:var(--b);font-weight:800;letter-spacing:.14em;font-size:.68rem}
.ph-b{padding:6px 20px;overflow:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}.ph-f{display:flex;flex-wrap:wrap;gap:10px;padding:14px 20px;border-top:1px solid var(--bd)}.ph-f .btn{flex:1 1 90px;margin:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}.kv span:first-child{color:var(--mu)}.kv b{text-align:right}
@keyframes fi{from{opacity:0}}@keyframes fo{to{opacity:0}}@keyframes up{from{transform:translateY(70px) scale(.92);opacity:0}}@keyframes dn{to{transform:translateY(70px) scale(.92);opacity:0}}
#toast{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}#toast.show{opacity:1}
</style></head><body><div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const K='colonia_v1',TEAMS={'PORTÃO/INSCRIÇÕES':'Coletar inscrições, garantir termos assinados, distribuir papéis de cardápio aos responsáveis, anotar e colocar pulseiras em crianças alérgicas e/ou com atenção especial.','ANIMAÇÃO':'Todos fazem parte; na abertura (antes e durante o Louvorzão) dançam e interagem com as crianças.','ÁGUA E BANHEIRO':'Distribuição de água e levar crianças ao banheiro em momentos específicos (meninas com meninas, meninos com meninos).','COZINHA/LANCHE':'Únicos a entrar na igreja para pegar os lanches na hora do teatro; ajudam na contagem de crianças; lembram as crianças com alergia.','TEATRO':'Responsáveis pelos momentos de teatro e pelos ensaios nos dias solicitados; qualquer um pode ser chamado se necessário.','MÍDIA':'Responsáveis pela mídia; únicos, junto da coordenação, a ficar com celulares durante o dia.','CRIANÇAS COM NECESSIDADES ESPECIAIS':'Animadores focados em crianças que correm ou têm atenção especial; elaboram atividades para incluir todas.','LOGÍSTICA':'Atenção e alteração do cronograma ao longo do dia; observam atrasos e atualizam o quadro (2 a 3 pessoas).'};
const TABS=['Painel','Financeiro','Doação','Crianças','Animadores','Ideias','Reuniões','Fotos','Admin','Membros'];
const IMG=['linear-gradient(135deg,#0284C7,#EC4899)','linear-gradient(135deg,#EC4899,#2563EB)','linear-gradient(135deg,#2563EB,#F43F5E)','linear-gradient(135deg,#0ea5e9,#f472b6)'];
const EM=['🎈 Alegria','🍎 Lanche','⚽ Brincadeiras','🙏 Acolhimento'];
let D=JSON.parse(localStorage.getItem(K)||'null')||{pass:'negão',adm:null,coords:[],kids:[],fields:[],fin:[],members:[],sports:['Futebol','Vôlei / Baleado','Barra Bandeira'],ideas:[],meets:[],notes:''};
D.ws=D.ws||[{id:'w1',name:'Origami'},{id:'w2',name:'Bijuterias'}];D.photos=D.photos||[];D.gastos=D.gastos||[];D.dons=D.dons||[];D.ent=D.ent||[];D.food=D.food||[];D.fin.forEach(f=>{if(f.type=='Compras')f.type='Confra'});document.documentElement.setAttribute('data-theme',D.theme||'light');
let S={user:null,role:null,tab:0,slide:0,q:'',onlyAl:false,fl:'Compras',late:false,modal:null,saved:'salvo'};
const $=id=>document.getElementById(id),save=()=>{D._ts=Date.now();setTimeout(()=>pushRemote(),0);try{localStorage.setItem(K,JSON.stringify(D));S.saved='salvo'}catch(e){S.saved='erro';toast('Armazenamento cheio: exporte o backup e remova fotos pesadas.')}},uid=()=>Math.random().toString(36).slice(2,9),R=v=>'R$ '+(+v||0).toFixed(2).replace('.',','),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const greet=()=>{const h=new Date().getHours();return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'};
const paid=f=>(f.pays||[]).reduce((a,p)=>a+ +p.v,0),st=f=>{const p=paid(f);return p>=f.total?'Pago / OK':p>0?'Parcial':'Pendente'},near=f=>st(f)!='Pago / OK'&&f.due&&(new Date(f.due)-Date.now())/864e5<=7;
const stc=s=>s=='Pago / OK'?'ok':s=='Parcial'?'am':'rd';
const arr=(k,id)=>D[k].find(x=>x.id==id);
function go(t){S.tab=t;S.slide=(S.slide+1)%1000;render()}
function render(){
if(!S.role){$('app').innerHTML=`<div class="login"><button class="tg" style="position:fixed;top:14px;right:14px" onclick="tgl()">${D.theme=='dark'?'☀️ Claro':'🌙 Escuro'}</button><div class="lg"><small>IGREJA</small><h1>COLÔNIA<br><em>DE FÉRIAS</em></h1><p>Uma semana de alegria, comida e acolhimento para as crianças.</p><button class="big" onclick="S.role='m';S.user='Membro';S.tab=9;render()">MEMBRO</button><button class="big pk" onclick="cmodal()">COORDENAÇÃO</button></div></div>`+(S.modal||'');return}
const co=S.role=='c',vis=co?TABS.filter(t=>t!='Membros'&&(t!='Admin'||D.adm==S.user)):['Financeiro','Membros'];
const home=co&&S.tab==0,cur=co?TABS[S.tab]:(S.tab==1?'Financeiro':'Membros'),np=D.photos.length,ph=np?D.photos[S.slide%np]:null,nd=np||4;
const hero=`<div class="hero" style="--sl:${S.slide%4};${ph?`--ph:url('${esc(ph.src)}')`:''}"><div class="top"><span>COLÔNIA DE FÉRIAS</span><span class="cl">● NUVEM: ${S.saved.toUpperCase()}</span><button class="tg" onclick="tgl()">${D.theme=='dark'?'☀️ Claro':'🌙 Escuro'}</button></div>${home?`<h1>${greet()}, <em>${esc(S.user)}.</em></h1>`:`<small>${co?'COORDENAÇÃO':'MEMBRO'} \\ ÁREA</small><h1>${cur.toUpperCase()}</h1>`}<div class="sub">${esc(ph&&ph.cap||EM[S.slide%4])}</div><div class="dots">${Array.from({length:nd},(_,i)=>`<span class="${i==S.slide%nd?'on':''}" onclick="S.slide=${i};render()"></span>`).join('')}</div></div>`;
const nav=`<nav>${(co?TABS:TABS).filter(t=>vis.includes(t)).map(t=>`<button class="${TABS[S.tab]==t?'on':''}" onclick="go(${TABS.indexOf(t)})">${t=='Financeiro'&&!co?'🔒 ':''}${t}</button>`).join('')}<button onclick="S.role=null;render()">Sair</button></nav>`;
const al=D.kids.filter(k=>k.al=='Sim').length;
const tick=`<div class="tk"><span>☁️ Dados ${S.saved} neste aparelho • ${D.kids.length} crianças • ${al} com alergia • ${D.fin.filter(near).length} prazos próximos • Que a colônia seja só alegria! 💙💗</span></div>`;
let body=!co?(S.tab==1?'<div class="card" style="text-align:center"><h2>🔒</h2><p>Financeiro restrito à Coordenação.</p></div>':memb()):[panel,fin,doa,kids,anim,ideas,meets,photos,admin][S.tab]();
$('app').innerHTML=hero+nav+'<main>'+body+'</main>'+tick+(S.modal||'');}
function cmodal(){modal(`<h3>COORDENAÇÃO</h3><input id="cn" placeholder="Seu nome" autocapitalize="words" autocomplete="name"><input id="cp" type="password" placeholder="Senha" autocorrect="on" spellcheck="true" autocapitalize="sentences"><label><input type="checkbox" style="width:auto" onchange="$('cp').type=this.checked?'text':'password'"> Mostrar senha</label><p id="er" style="color:var(--rd)"></p><button class="btn" onclick="login()">Entrar</button>`)}
async function login(){const n=$('cn').value.trim(),p=$('cp').value.trim();if(!n)return $('er').textContent='Informe seu nome.';
$('er').textContent='Conectando...';S.pass=p;const r=await sync('get');let ok=false;
if(r&&r.ok){ok=true;S.noSync=false;if(r.data){bkp();D=mergeD(D,r.data);fixD();try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}}
else if(r&&r.error=='auth')return $('er').textContent='Senha incorreta.';
else{ok=p.toLowerCase()==String(D.pass).trim().toLowerCase();S.noSync=true}
if(!ok)return $('er').textContent='Senha incorreta.';
const enter=()=>{if(!D.coords.includes(n))D.coords.push(n);save();S.user=n;S.role='c';S.tab=0;S.modal=null;setCl(S.noSync?'offline':'sincronizado');render()};
if(!D.adm)ask('Você é o primeiro coordenador. Assumir como ADM do sistema?',()=>{D.adm=n;enter()},enter,'Assumir ADM','Agora não');else enter()}


function allPaid(){const ps=D.fin.flatMap(f=>(f.pays||[]).map(p=>({...p,item:f.name,t:f.type}))),tot=ps.reduce((a,p)=>a+ +p.v,0);
return `<div class="card"><div class="n">${R(tot)}</div>pago no total (${ps.length} pagamentos)<br><button class="btn s" onclick="navigator.clipboard.writeText(${esc(JSON.stringify(JSON.stringify(ps.map(p=>p.date+' '+p.item+' '+R(p.v)+' ('+p.by+')').join('\n'))))});toast('Resumo copiado')">Copiar resumo</button></div>`+ps.map(p=>`<div class="card row"><span>${p.date} · ${esc(p.item)} (${p.t}) · ${esc(p.by)}</span><b>${R(p.v)}</b>${p.img?`<a href="${p.img}" target="_blank">📎 comprovante</a>`:''}</div>`).join('')}
function modal(h){S.modal=`<div class="ov" onclick="if(event.target==this){S.modal=null;render()}"><div>${h}</div></div>`;render()}
function close_(){S.modal=null;render()}
function fform(t){modal(`<h3>Novo (${t})</h3><input id="f1" placeholder="Pessoa / Item"><input id="f2" type="number" placeholder="Valor total"><label>Prazo</label><input id="f3" type="date">${t=='Camisas'?'<select id="f4"><option>P<option>M<option>G<option>GG<option>EXG</select>':''}<button class="btn" onclick="D.fin.push({id:uid(),type:'${t}',name:$('f1').value,total:+$('f2').value,due:$('f3').value,size:${t=='Camisas'?"$('f4').value":"''"},pays:[]});save();close_()">Salvar</button>`)}
function pform(id){modal(`<h3>Registrar pagamento</h3><input id="p1" type="number" placeholder="Valor pago"><input id="p2" type="date" value="${new Date().toISOString().slice(0,10)}"><label>Comprovante (imagem)</label><input id="p3" type="file" accept="image/*,.pdf"><button class="btn" onclick="payOk('${id}')">Salvar</button>`)}
function payOk(id){const f=arr('fin',id),v=+$('p1').value,fl=$('p3').files[0],add=img=>{f.pays.push({v,date:$('p2').value,by:S.user,img});save();close_()};if(!v)return;if(fl){const r=new FileReader();r.onload=()=>add(r.result);r.readAsDataURL(fl)}else add('')}

function kids(){let l=D.kids.filter(k=>(!S.onlyAl||k.al=='Sim')&&JSON.stringify(k).toLowerCase().includes(S.q.toLowerCase()));
return `<div class="card bar"><input placeholder="Buscar..." value="${esc(S.q)}" oninput="S.q=this.value;render();this.focus()"><button class="btn" onclick="kform()">+ Criança</button><button class="btn" onclick="bulk()">Importar em lote</button><button class="btn s" onclick="S.onlyAl=!S.onlyAl;render()">${S.onlyAl?'✔ ':''}Somente alérgicos</button><button class="btn s" onclick="modal('<h3>Novo campo</h3><input id=nf placeholder=Nome><select id=nt><option value=text>Texto<option value=yn>Sim/Não<option value=num>Número</select><button class=btn onclick=addField()>Criar</button>')">+ Campo</button><button class="btn s" onclick="print()">🖨</button></div>`+l.map(k=>`<div class="card ${k.al=='Sim'?'al':''}" data-f="k:${k.id}"><div class="row"><b>${esc(k.name)}, ${esc(k.age)} anos</b>${k.al=='Sim'?`<span class="tag rd">ALERGIA: ${esc(k.alDesc)}</span>`:''}</div>Mãe: ${esc(k.mae)} · Pai: ${esc(k.pai)}<br>${k.sp?'⭐ '+esc(k.sp)+'<br>':''}Termo: <span class="tag ${k.term=='Assinado'?'ok':'am'}">${k.term}</span> ${k.tel?`<a href="https://wa.me/55${k.tel.replace(/\D/g,'')}" target="_blank">WhatsApp</a>`:''}${D.fields.map(f=>k.x&&k.x[f.id]?`<br>${esc(f.name)}: ${esc(k.x[f.id])}`:'').join('')}<br><button class="btn s" onclick="kform('${k.id}')">Editar</button><button class="btn s" onclick="del('kids','${k.id}')">🗑</button></div>`).join('')}
function addField(){D.fields.push({id:uid(),name:$('nf').value,t:$('nt').value});save();close_()}
function kform(id){const k=id?arr('kids',id):{al:'Não',term:'Pendente',x:{}};modal(`<h3>Criança</h3><input id="k1" placeholder="Nome completo" value="${esc(k.name)}"><input id="k2" type="number" placeholder="Idade" value="${esc(k.age)}"><select id="k3"><option ${k.al=='Não'?'selected':''}>Não<option ${k.al=='Sim'?'selected':''}>Sim</select> possui alergias?<input id="k4" placeholder="Descrição da alergia" value="${esc(k.alDesc)}"><input id="k5" placeholder="Atenção especial / observações" value="${esc(k.sp)}"><input id="k6" placeholder="Mãe" value="${esc(k.mae)}"><input id="k7" placeholder="Pai" value="${esc(k.pai)}"><input id="k8" placeholder="WhatsApp" value="${esc(k.tel)}"><select id="k9"><option ${k.term=='Assinado'?'selected':''}>Assinado<option ${k.term!='Assinado'?'selected':''}>Pendente</select>${D.fields.map(f=>`<input data-f="${f.id}" placeholder="${esc(f.name)}" value="${esc(k.x?.[f.id])}">`).join('')}<button class="btn" onclick="kok('${id||''}')">Salvar</button>`)}
function kok(id){const o={id:id||uid(),name:$('k1').value,age:$('k2').value,al:$('k3').value,alDesc:$('k4').value,sp:$('k5').value,mae:$('k6').value,pai:$('k7').value,tel:$('k8').value,term:$('k9').value,x:{}};document.querySelectorAll('[data-f]').forEach(i=>o.x[i.dataset.f]=i.value);if(id)Object.assign(arr('kids',id),o);else D.kids.push(o);save();close_()}
function bulk(){modal(`<h3>Importar em lote</h3><p>Cole texto (um bloco por criança, ex.: "Nome: Ana, 8 anos, mãe Maria, tel 8199999-0000, alergia: leite") ou envie CSV/TXT/JSON. (PDF/imagem com OCR: não incluído nesta versão.)</p><textarea id="bt" rows="6"></textarea><input type="file" id="bf" accept=".csv,.xlsx,.xls,.txt,.json,.pdf,image/*" onchange="bfile(this)"><button class="btn" onclick="bprev()">Pré-visualizar</button>`)}
async function bfile(i){$('bt').value=await f2t(i.files[0])}
function parse(t){return t.split(/\n\s*\n|\n(?=[^\n:]*?\d+\s*anos)/).map(b=>b.trim()).filter(Boolean).map(b=>{const g=re=>(b.match(re)||[])[1]||'';const al=g(/alergi[ao]s?\s*[:\-]?\s*([^\n,;]+)/i);return{id:uid(),name:g(/(?:nome\s*[:\-]?\s*)([^\n,;]+?)(?:,|;|\n|\d|$)/i)||b.split(/[,\n;]/)[0].replace(/nome\s*:/i,'').trim(),age:g(/(\d{1,2})\s*anos/i)||g(/idade\s*[:\-]?\s*(\d+)/i),mae:g(/m[ãa]e\s*[:\-]?\s*([^\n,;]+)/i),pai:g(/pai\s*[:\-]?\s*([^\n,;]+)/i),tel:g(/(\(?\d{2}\)?\s?9?\d{4}[-\s]?\d{4})/),al:al&&!/^n[ãa]o/i.test(al)?'Sim':'Não',alDesc:al,sp:'',term:'Pendente',x:{}}})}
function bprev(){const l=csvKids($('bt').value)||parse($('bt').value);window._b=l;modal(`<h3>Conferir (${l.length})</h3>${l.map((k,i)=>`<div class="${k.al=='Sim'?'al':''}"><input value="${esc(k.name)}" oninput="_b[${i}].name=this.value"><input value="${esc(k.age)}" oninput="_b[${i}].age=this.value" placeholder="idade"><input value="${esc(k.alDesc)}" oninput="_b[${i}].alDesc=this.value;_b[${i}].al=this.value?'Sim':'Não'" placeholder="alergia"></div>`).join('')}<button class="btn" onclick="D.kids.push(..._b);save();close_()">Confirmar e Salvar Todas</button>`)}

function sports(){return `<div class="card bar"><button class="btn" onclick="askText('Nova modalidade','',n=>{D.sports.push(n);save();render()})">+ Modalidade</button></div><div class="g">${D.sports.map(s=>`<div class="card" data-f="s:${esc(s)}"><b>${esc(s)}</b><div class="n">${D.members.filter(m=>m.sport==s).length}</div></div>`).join('')}</div><div class="card"><b>Escala rápida</b>${D.members.map(m=>`<div class="row">${esc(m.name)}<select style="width:auto" onchange="arr('members','${m.id}').sport=this.value;save();render()"><option value="">—${D.sports.map(s=>`<option ${m.sport==s?'selected':''}>${esc(s)}`).join('')}</select></div>`).join('')}</div>`}

return `<div class="card"><b>Animadores inscritos: ${D.members.length}</b><br><small>Requisitos: +14 anos · disponível em nov, dez e jan · <a href="https://forms.gle/5s23P6qQG8qEWZP99" target="_blank">formulário</a></small><div class="bar" style="margin-top:12px"><button class="btn" onclick="mform()">+ Animador</button><button class="btn s" onclick="mform('','Coordenação')">+ Coordenação</button><button class="btn s" onclick="animImp()">Importar animadores</button><button class="btn s" onclick="bulk()">Importar crianças inscritas</button></div></div>`+D.members.filter(m=>S.sub!=1||isCo(m)).map(m=>`<div class="card" data-f="m:${m.id}"><div class="row"><b>${esc(m.name)}, ${esc(m.age)} anos</b><span class="tag ${m.age>14?'ok':'rd'}">${m.age>14?'+14':'<=14 ✗'}</span></div>${isCo(m)?'<span class="tag" style="background:var(--b);color:var(--btx)">COORDENAÇÃO · ORG. GERAL</span>':esc(m.role)+' · '+esc(m.team)} · ${esc(m.sport)} · Camisa ${esc(m.shirt)} · ${esc(D.ws.find(w=>w.id==m.ws)?.name||'')} · ${esc(m.avail)}<div class="mv"><select onchange="mv('${m.id}','team',this.value)">${Object.keys(TEAMS).map(t=>`<option ${m.team==t?'selected':''}>${t}`).join('')}</select><select onchange="mv('${m.id}','sport',this.value)"><option value="">Esporte${D.sports.map(q=>`<option ${m.sport==q?'selected':''}>${esc(q)}`).join('')}</select><select onchange="mv('${m.id}','ws',this.value)"><option value="">Oficina${D.ws.map(w=>`<option value="${w.id}" ${m.ws==w.id?'selected':''}>${esc(w.name)}`).join('')}</select></div><button class="btn s" onclick="mform('${m.id}')">Editar</button><button class="btn s" onclick="del('members','${m.id}')">🗑</button></div>`).join('')}
function mform(id,pr){const m=id?arr('members',id):{role:pr||''};modal(`<h3>Membro</h3><input id="m1" placeholder="Nome" value="${esc(m.name)}"><input id="m2" type="number" placeholder="Idade" value="${esc(m.age)}"><input id="m3" placeholder="Função" value="${esc(m.role)}"><select id="m4">${Object.keys(TEAMS).map(t=>`<option ${m.team==t?'selected':''}>${t}`).join('')}</select><select id="m5"><option value="">Esporte${D.sports.map(s=>`<option ${m.sport==s?'selected':''}>${esc(s)}`).join('')}</select><select id="m6">${['P','M','G','GG','EXG'].map(s=>`<option ${m.shirt==s?'selected':''}>${s}`).join('')}</select><input id="m7" placeholder="Disponibilidade (nov/dez/jan)" value="${esc(m.avail)}"><button class="btn" onclick="mok('${id||''}')">Salvar</button>`)}
function mok(id){const o={id:id||uid(),name:$('m1').value,age:+$('m2').value,role:$('m3').value,team:$('m4').value,sport:$('m5').value,shirt:$('m6').value,avail:$('m7').value};if(id)Object.assign(arr('members',id),o);else D.members.push(o);save();close_()}
function ideas(){return `<div class="card"><input id="i1" placeholder="Nova ideia"><button class="btn" onclick="if($('i1').value){D.ideas.push({id:uid(),t:$('i1').value,s:'Nova'});save();render()}">Adicionar</button></div>`+D.ideas.map(i=>`<div class="card row" data-f="i:${i.id}"><span>${esc(i.t)}</span><select style="width:auto" onchange="arr('ideas','${i.id}').s=this.value;save()">${['Nova','Em andamento','Aprovada','Feita'].map(s=>`<option ${i.s==s?'selected':''}>${s}`).join('')}</select><button class="btn s" onclick="del('ideas','${i.id}')">🗑</button></div>`).join('')}
function meets(){return `<div class="card"><input id="r1" type="date"><input id="r2" type="time"><textarea id="r3" placeholder="Pauta / decisões"></textarea><input id="r4" placeholder="Responsáveis / encaminhamentos"><button class="btn" onclick="D.meets.push({id:uid(),d:$('r1').value,h:$('r2').value,p:$('r3').value,r:$('r4').value});save();render()">Registrar</button></div>`+D.meets.map(m=>`<div class="card" data-f="r:${m.id}"><b>${m.d} ${m.h}</b><p>${esc(m.p)}</p>👤 ${esc(m.r)}<br><button class="btn s" onclick="del('meets','${m.id}')">🗑</button></div>`).join('')}
function admin(){return `<div class="card"><b>👑 ADM: ${esc(D.adm)}</b><br><input id="a1" placeholder="Nova senha da coordenação"><button class="btn" onclick="if($('a1').value){D.pass=$('a1').value;save();toast('Senha alterada')}">Trocar senha</button></div><div class="card"><b>Coordenadores</b><input id="a2" placeholder="Adicionar coordenador"><button class="btn" onclick="if($('a2').value){D.coords.push($('a2').value);save();render()}">Adicionar</button>${D.coords.map(c=>`<div class="row">${esc(c)} ${c==D.adm?'👑':`<span><button class="btn s" onclick="ask('Transferir ADM para ${esc(c)}?',()=>{D.adm='${esc(c)}';save();S.tab=0;render()},null,'Transferir')">Tornar ADM</button><button class="btn s" onclick="D.coords=D.coords.filter(x=>x!='${esc(c)}');save();render()">🗑</button></span>`}</div>`).join('')}</div><div class="card"><button class="btn s" onclick="pullRemote()">Baixar dados da nuvem</button><button class="btn" onclick="expJson()">Exportar backup JSON</button><input type="file" accept=".json" onchange="const r=new FileReader();r.onload=()=>{D=JSON.parse(r.result);save();render()};r.readAsText(this.files[0])"></div>`}

function workshops(){return `<div class="card bar"><button class="btn" onclick="askText('Nome da nova oficina','',n=>{D.ws.push({id:uid(),name:n});save();render()})">+ Oficina</button></div><div class="g">${D.ws.map(w=>`<div class="card" data-f="w:${w.id}"><input value="${esc(w.name)}" onchange="arr('ws','${w.id}').name=this.value;save()"><div class="n">${D.members.filter(m=>m.ws==w.id).length}</div>membros<br><button class="btn s" onclick="del('ws','${w.id}')">🗑</button></div>`).join('')}</div><div class="card"><b>Alocar membros</b>${D.members.map(m=>`<div class="row">${esc(m.name)}<select style="width:auto" onchange="arr('members','${m.id}').ws=this.value;save();render()"><option value="">—${D.ws.map(w=>`<option value="${w.id}" ${m.ws==w.id?'selected':''}>${esc(w.name)}`).join('')}</select></div>`).join('')||'<p>Cadastre membros primeiro.</p>'}</div>`}
function photos(){return `<div class="card"><b>Fotos do carrossel</b><p>Sem fotos cadastradas, o banner usa a foto padrão da colônia. Troque de aba para ver o banner mudar.</p><input type="file" accept="image/*" multiple onchange="addPh(this.files)"><input id="pu" placeholder="ou cole o link da imagem"><button class="btn" onclick="if($('pu').value){D.photos.push({id:uid(),src:$('pu').value,cap:''});save();render()}">Adicionar link</button></div>`+D.photos.map((p,i)=>`<div class="card"><div style="height:140px;border-radius:12px;background:url('${esc(p.src)}') center/cover"></div><input value="${esc(p.cap)}" placeholder="Legenda" onchange="arr('photos','${p.id}').cap=this.value;save()"><button class="btn s" onclick="mvPh(${i},-1)">↑</button><button class="btn s" onclick="mvPh(${i},1)">↓</button><button class="btn s" onclick="del('photos','${p.id}')">🗑</button></div>`).join('')}
function addPh(fs){[...fs].forEach(f=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,1000/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);D.photos.push({id:uid(),src:c.toDataURL('image/jpeg',.7),cap:''});save();render()};im.src=r.result};r.readAsDataURL(f)})}
function mvPh(i,d){const j=i+d;if(j<0||j>=D.photos.length)return;[D.photos[i],D.photos[j]]=[D.photos[j],D.photos[i]];save();render()}
async function f2t(f){if(!f)return'';const n=f.name.toLowerCase();try{if(/\.xlsx?$/.test(n)){const w=XLSX.read(await f.arrayBuffer());return XLSX.utils.sheet_to_csv(w.Sheets[w.SheetNames[0]])}
if(n.endsWith('.pdf')){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t='';for(let i=1;i<=d.numPages;i++){const c=await(await d.getPage(i)).getTextContent();t+=c.items.map(x=>x.str).join(' ')+'\n\n'}return t}
if(f.type.startsWith('image/')){toast('Leitura de imagem (OCR) não funciona nesta página publicada. Digite ou cole o texto da ficha.');return''}
return await f.text()}catch(e){toast('Não consegui ler o arquivo. Cole o texto manualmente.');return''}}
function csvKids(t){const L=t.split(/\r?\n/).filter(Boolean);if(L.length<2)return null;const sp=L[0].includes(';')?';':',';const H=L[0].split(sp).map(x=>x.trim().toLowerCase());if(!H.some(h=>h.includes('nome')))return null;const ix=r=>H.findIndex(h=>r.test(h)),a=ix(/nome/),b=ix(/idade/),c=ix(/m[ãa]e/),d=ix(/pai/),e=ix(/tel|whats|contato/),f=ix(/alergi/);return L.slice(1).map(l=>{const v=l.split(sp),al=(v[f]||'').trim();return{id:uid(),name:(v[a]||'').trim(),age:(v[b]||'').trim(),mae:(v[c]||'').trim(),pai:(v[d]||'').trim(),tel:(v[e]||'').trim(),al:al&&!/^n[ãa]o/i.test(al)?'Sim':'Não',alDesc:al,sp:'',term:'Pendente',x:{}}})}

function animOk(){const l=$('at').value.split(/\n/).map(x=>x.trim()).filter(Boolean).map(x=>{const v=x.split(/[,;\t]/).map(q=>q.trim());return{id:uid(),name:v[0],age:+v[1]||0,role:'Animador',team:Object.keys(TEAMS).find(t=>t==(v[2]||'').toUpperCase())||'ANIMAÇÃO',sport:'',shirt:'M',avail:''}}).filter(m=>m.name&&!/^nome$/i.test(m.name));D.members.push(...l);save();close_()}

function anim(){const T=['Lista','Coordenação','Equipes','Esportes','Oficinas'];S.sub=S.sub||0;return `<div class="card bar">${T.map((t,i)=>`<button class="btn ${S.sub==i?'':'s'}" onclick="S.sub=${i};render()">${t}</button>`).join('')}</div>`+[memb,memb,teams,sports,workshops][S.sub]()}
function mv(id,k,v,rk,rid){arr('members',id)[k]=v;save();render();if(rk)openF(rk,rid)}
const teamOpts=t=>Object.keys(TEAMS).map(k=>`<option ${k==t?'selected':''}>${k}</option>`).join('');
function parseAn(t){return t.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).filter(x=>!/^nome\b/i.test(x)).map(x=>{const v=x.split(/[,;\t]/).map(q=>q.trim()),a=(x.match(/\b(\d{1,2})\b/)||[])[1],tk=Object.keys(TEAMS).find(k=>x.toUpperCase().includes(k.split(/[\/ ]/)[0]))||'ANIMAÇÃO';return{id:uid(),name:v[0].replace(/\d+\s*anos?/i,'').trim(),age:+a||0,role:'Animador',team:tk,sport:'',ws:'',shirt:'M',avail:''}}).filter(m=>m.name)}
function animImp(){modal(`<h3>Importar animadores</h3><p>Uma pessoa por linha: Nome, idade, equipe. Aceita texto, CSV, XLSX, TXT, JSON e PDF. Imagem (OCR) não funciona nesta página.</p><textarea id="at" rows="6"></textarea><input type="file" accept=".csv,.xlsx,.xls,.txt,.json,.pdf,image/*" onchange="f2t(this.files[0]).then(t=>$('at').value=t)"><button class="btn" onclick="animPrev()">Pré-visualizar</button>`)}
function animPrev(){window._a=parseAn($('at').value);modal(`<h3>Conferir (${_a.length})</h3>${_a.map((m,i)=>`<div class="mv"><input value="${esc(m.name)}" oninput="_a[${i}].name=this.value"><input type="number" value="${esc(m.age)}" oninput="_a[${i}].age=+this.value"><select onchange="_a[${i}].team=this.value">${teamOpts(m.team)}</select></div>`).join('')}<button class="btn" onclick="D.members.push(..._a);save();close_()">Confirmar e Salvar</button>`)}

function tgl(){D.theme=D.theme=='dark'?'light':'dark';save();document.documentElement.setAttribute('data-theme',D.theme);render()}
const FT=['Confra','Camisas','Arrecadação','Gastos','Balanço','Tudo'],FN={Tudo:'Tudo que foi pago'};
const today=()=>new Date().toISOString().slice(0,10),sum=(a,f)=>a.reduce((x,y)=>x+(f?f(y):+y.v),0),inFin=t=>sum(D.fin.filter(f=>f.type==t),paid),totIn=()=>sum(D.fin,paid)+sum(D.dons)+sum(D.ent),totOut=()=>sum(D.gastos),sal=()=>totIn()-totOut();
function rd(id,cb){const f=$(id)&&$(id).files[0];if(!f)return cb('','');const r=new FileReader();r.onload=()=>cb(r.result,f.name);r.readAsDataURL(f)}
const att=x=>x.src?(x.src.startsWith('data:image')?`<img src="${x.src}" style="max-width:100%;border-radius:10px;margin-top:8px">`:`<div>📎 ${esc(x.fn)} (arquivo guardado)</div>`):'';
function fin(){if(!FT.includes(S.fl))S.fl='Confra';const t=S.fl;
let h=`<div class="card bar">${FT.map(x=>`<button class="btn ${t==x?'':'s'}" onclick="S.fl='${x}';render()">${FN[x]||x}</button>`).join('')}</div>`;
h+=`<div class="card bar"><button class="btn s" onclick="finImp()">Importar planilha</button><button class="btn s" onclick="finExp()">Exportar planilha</button></div>`;
if(t=='Confra'||t=='Camisas'){const l=D.fin.filter(f=>f.type==t&&(!S.late||near(f)));let sz='';if(t=='Camisas'){const c={};D.fin.filter(f=>f.type=='Camisas').forEach(f=>c[f.size]=(c[f.size]||0)+1);sz='<div class="card">Tamanhos: '+['P','M','G','GG','EXG'].map(q=>`<b>${q}</b>: ${c[q]||0}`).join(' · ')+'</div>'}
h+=`<div class="card bar"><button class="btn s" onclick="S.late=!S.late;render()">${S.late?'✔ ':''}Prazo próximo</button><button class="btn" onclick="fform('${t}')">+ Novo</button></div>`+sz+(l.map(f=>`<div class="card" data-f="f:${f.id}"><div class="row"><b>${esc(f.name)}${f.size?' ('+f.size+')':''}</b><span class="tag ${stc(st(f))}">${st(f)}</span></div>Total ${R(f.total)} · Pago ${R(paid(f))} · Saldo ${R(f.total-paid(f))}<br>Prazo: ${f.due||'—'} ${near(f)?'<span class="tag rd">PRAZO PRÓXIMO</span>':''}<br><button class="btn s" onclick="pform('${f.id}')">+ Pagamento</button><button class="btn s" onclick="del('fin','${f.id}')">🗑</button></div>`).join('')||'<p>Sem registros.</p>')}
else if(t=='Arrecadação')h+=`<div class="g">${[['Confra',inFin('Confra')],['Camisas',inFin('Camisas')],['Doações em dinheiro',sum(D.dons)],['Outras entradas',sum(D.ent)],['TOTAL ARRECADADO',totIn()]].map(([a,b])=>`<div class="card"><div class="n">${R(b)}</div>${a}</div>`).join('')}</div><div class="card bar"><button class="btn" onclick="entForm()">+ Outra entrada</button></div>`+D.ent.map(e=>`<div class="card row" data-f="e:${e.id}"><span>${e.date} · ${esc(e.d)}</span><b>${R(e.v)}</b><button class="btn s" onclick="del('ent','${e.id}')">🗑</button></div>`).join('');
else if(t=='Gastos')h+=`<div class="card"><div class="n">${R(totOut())}</div>gasto até agora<div class="bar" style="margin-top:12px"><button class="btn" onclick="gform()">+ Novo gasto</button></div></div>`+D.gastos.map(g=>`<div class="card" data-f="g:${g.id}"><div class="row"><b>${esc(g.d)}</b><b>${R(g.v)}</b></div>${g.date} ${esc(g.obs)}${att(g)}<br><button class="btn s" onclick="del('gastos','${g.id}')">🗑</button></div>`).join('');
else if(t=='Balanço'){const v=sal(),c=v>=0?'var(--ok)':'var(--rd)';h+=`<div class="card" style="text-align:center"><div class="n" style="font-size:2.6rem;color:${c}">${v>=0?'POSITIVO':'NEGATIVO'}</div><p>Arrecadado ${R(totIn())} − Gasto ${R(totOut())}</p><div class="n" style="color:${c}">Diferença: ${R(v)}</div></div>`}
else h+=allPaid();
return h}
function entForm(){modal(`<h3>Outra entrada</h3><input id="e1" placeholder="Descrição"><input id="e2" type="number" placeholder="Valor (R$)"><input id="e3" type="date" value="${today()}"><button class="btn" onclick="if(+$('e2').value){D.ent.push({id:uid(),d:$('e1').value,v:+$('e2').value,date:$('e3').value});save();close_()}">Salvar</button>`)}
function gform(){modal(`<h3>Novo gasto</h3><input id="g1" placeholder="Descrição"><input id="g2" type="number" placeholder="Valor (R$)"><input id="g3" type="date" value="${today()}"><textarea id="g4" placeholder="Observações / texto do comprovante"></textarea><label>Comprovante (imagem, PDF ou arquivo)</label><input id="g5" type="file"><button class="btn" onclick="gok()">Salvar</button>`)}
function gok(){const v=+$('g2').value;if(!v)return;rd('g5',(src,fn)=>{D.gastos.push({id:uid(),d:$('g1').value,v,date:$('g3').value,obs:$('g4').value,src,fn});save();close_()})}
function doa(){S.ds=S.ds||0;let h=`<div class="card bar"><button class="btn ${S.ds==0?'':'s'}" onclick="S.ds=0;render()">Doação em dinheiro</button><button class="btn ${S.ds==1?'':'s'}" onclick="S.ds=1;render()">Doação alimentícia</button></div>`;
